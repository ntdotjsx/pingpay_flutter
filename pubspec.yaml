name: pingpay_mobile
description: "PingPay - Friend Debt & Bill Splitting Flutter Application"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  pinput: ^5.0.1
  shimmer: ^3.0.0
  google_sign_in: ^6.2.2
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  figma_squircle: ^0.6.3
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  image_picker: ^1.1.2
  thai_promptpay: ^0.3.0
  flutter_hot_toast: ^0.0.3
  lottie: ^2.7.0
  shorebird_code_push: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    - family: LINESeedSansTH
      fonts:
        - asset: assets/fonts/LINESeedSansTH_A_Th.ttf
          weight: 100
        - asset: assets/fonts/LINESeedSansTH_A_Rg.ttf
          weight: 400
        - asset: assets/fonts/LINESeedSansTH_A_Bd.ttf
          weight: 700
        - asset: assets/fonts/LINESeedSansTH_A_XBd.ttf
          weight: 800
        - asset: assets/fonts/LINESeedSansTH_A_He.ttf
          weight: 900

  assets:
    - assets/
    - assets/Olympics_Table.json
    - shorebird.yaml
